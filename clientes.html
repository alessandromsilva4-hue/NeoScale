<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NeoScale | Clientes</title><link rel="icon" href="img/favicon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/sidebar.css"><link rel="stylesheet" href="css/tema-verde.css">
<style>
.clients-page{padding:24px;min-height:100vh}.clients-wrap{max-width:1250px;margin:0 auto}.clients-head{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:18px}.clients-title{display:flex;align-items:center;gap:12px}.clients-title .title-icon{width:44px;height:44px;border-radius:13px;background:#e7f7f1;color:#087a57;display:grid;place-items:center;font-size:21px}.clients-title h1{margin:0;font-size:24px}.clients-title p{margin:4px 0 0;color:#71808a;font-size:13px}.btn-primary,.btn-secondary,.btn-danger{border:0;border-radius:10px;padding:10px 14px;font-weight:700;font-size:12px;cursor:pointer}.btn-primary{background:#087a57;color:#fff}.btn-secondary{background:#eef4f2;color:#31515a}.btn-danger{background:#fff0f0;color:#b42318}.toolbar{background:#fff;border:1px solid #e4ece9;border-radius:16px;padding:14px;display:flex;gap:10px;align-items:center;margin-bottom:14px;box-shadow:0 7px 22px rgba(18,35,45,.04)}.search{flex:1;position:relative}.search i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#82929a}.search input{width:100%;box-sizing:border-box;padding:11px 12px 11px 36px;border:1px solid #dbe5e2;border-radius:10px;outline:none}.search input:focus{border-color:#58ad90}.clients-table{background:#fff;border:1px solid #e4ece9;border-radius:16px;overflow:auto;box-shadow:0 7px 22px rgba(18,35,45,.04)}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid #edf1f0;font-size:12px}th{font-size:10px;text-transform:uppercase;color:#71808a;letter-spacing:.04em;background:#fbfdfc}tbody tr:hover{background:#fbfefd}.client-name{font-weight:700;color:#20333b}.muted{color:#819098}.actions{display:flex;gap:6px}.table-btn{width:31px;height:31px;border:1px solid #dfe8e5;background:#fff;border-radius:8px;cursor:pointer;color:#2f5b50}.table-btn.danger{color:#b42318}.empty{padding:36px;text-align:center;color:#7a8a92}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}.stat{background:#fff;border:1px solid #e4ece9;border-radius:14px;padding:13px 15px}.stat span{display:block;color:#71808a;font-size:11px}.stat strong{display:block;font-size:20px;margin-top:4px}.modal-backdrop[hidden]{display:none!important}.modal-backdrop{position:fixed;inset:0;background:rgba(13,28,24,.38);display:grid;place-items:center;padding:18px;z-index:1000}.modal{width:min(620px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.18)}.modal-head{padding:17px 20px;border-bottom:1px solid #edf1f0;display:flex;justify-content:space-between;align-items:center}.modal-head h2{margin:0;font-size:18px}.modal-close{border:0;background:transparent;font-size:20px;cursor:pointer;color:#66777f}.modal-body{padding:20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:11px;font-weight:700;color:#4d626b}.field input,.field textarea{border:1px solid #dbe5e2;border-radius:9px;padding:10px;outline:none;font:inherit;font-size:13px}.field textarea{min-height:80px;resize:vertical}.modal-foot{padding:14px 20px;border-top:1px solid #edf1f0;display:flex;justify-content:flex-end;gap:8px}.history{margin-top:18px}.history h3{font-size:14px;margin:0 0 10px}.history-list{display:grid;gap:8px}.history-item{border:1px solid #e7eeec;border-radius:10px;padding:10px;font-size:12px}.history-item strong{margin-right:8px}@media(max-width:700px){.clients-page{padding:14px}.clients-head{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.toolbar{flex-direction:column;align-items:stretch}}
</style>
</head>
<body>
<div class="layout"><aside class="sidebar" data-sidebar></aside><main class="content clients-page">
<div class="clients-wrap">
  <header class="clients-head"><div class="clients-title"><div class="title-icon"><i class="bi bi-people"></i></div><div><h1>Clientes</h1><p>Cadastro, pesquisa e histórico de clientes.</p></div></div><button class="btn-primary" id="btnNovo"><i class="bi bi-plus-lg"></i> Novo cliente</button></header>
  <section class="stats"><div class="stat"><span>Total de clientes</span><strong id="statTotal">0</strong></div><div class="stat"><span>Com telefone</span><strong id="statTelefone">0</strong></div><div class="stat"><span>Cadastrados recentemente</span><strong id="statRecentes">0</strong></div></section>
  <div class="toolbar"><div class="search"><i class="bi bi-search"></i><input id="busca" placeholder="Buscar por nome, telefone ou e-mail..."></div><button class="btn-secondary" id="btnAtualizar"><i class="bi bi-arrow-clockwise"></i> Atualizar</button></div>
  <section class="clients-table"><table><thead><tr><th>Cliente</th><th>Telefone</th><th>E-mail</th><th>Cadastro</th><th>Ações</th></tr></thead><tbody id="lista"><tr><td colspan="5" class="empty">Carregando clientes...</td></tr></tbody></table></section>
</div></main></div>
<div class="modal-backdrop" id="modal" hidden><section class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2 id="modalTitulo">Novo cliente</h2><button type="button" class="modal-close" id="fecharModal"><i class="bi bi-x-lg"></i></button></div><form id="formCliente"><div class="modal-body"><div class="form-grid"><div class="field"><label for="nome">Nome *</label><input id="nome" required maxlength="120"></div><div class="field"><label for="telefone">Telefone</label><input id="telefone" maxlength="30"></div><div class="field"><label for="email">E-mail</label><input id="email" type="email" maxlength="160"></div><div class="field"><label for="documento">CPF/CNPJ</label><input id="documento" maxlength="30"></div><div class="field"><label for="endereco">Endereço</label><input id="endereco" maxlength="180"></div><div class="field"><label for="bairro">Bairro</label><input id="bairro" maxlength="100"></div><div class="field full"><label for="observacoes">Observações</label><textarea id="observacoes" maxlength="500"></textarea></div></div><div class="history" id="historicoCliente"></div></div><div class="modal-foot"><button type="button" class="btn-secondary" id="cancelarModal">Cancelar</button><button type="submit" class="btn-primary" id="btnSalvar">Salvar cliente</button></div></form></section></div>
<script src="js/sidebar-menu.js"></script>
<script type="module">import { protegerPagina } from './js/sessao.js'; protegerPagina('clientes');</script>
<script type="module" src="js/clientes.js"></script>
</body></html>
