<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoScale | Configurações</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/tabela.css">
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="stylesheet" href="css/tema-verde.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar" data-sidebar></aside>

        <main class="content">
            <header class="page-header">
                <h2>Configurações</h2>
                <p>Personalização do NeoScale</p>
            </header>

            <section class="form-card">
                <h3>Dados do Restaurante</h3>
                <div class="form-grid">
                    <div>
                        <label for="nomeRestaurante">Nome do Restaurante</label>
                        <input id="nomeRestaurante" type="text" placeholder="Ex: Restaurante Japonês">
                    </div>
                    <div>
                        <label for="precoPadrao">Preço Padrão Kg</label>
                        <input id="precoPadrao" type="number" step="0.01" placeholder="89.90">
                    </div>
                    <div>
                        <label for="impressora">Impressora</label>
                        <input id="impressora" type="text" placeholder="Térmica 80mm">
                    </div>
                    <div>
                        <label for="larguraPapel">Largura do papel</label>
                        <select id="larguraPapel">
                            <option value="58">58 mm</option>
                            <option value="80">80 mm</option>
                        </select>
                    </div>
                </div>

                <div class="form-grid">
                    <div>
                        <label for="modeloBalanca">Balança</label>
                        <input id="modeloBalanca" type="text" placeholder="USB / Serial / Bluetooth">
                    </div>
                    <div>
                        <label for="modoImpressao">Modo de impressão</label>
                        <select id="modoImpressao">
                            <option value="navegador">Navegador</option>
                            <option value="direta">Impressão direta</option>
                        </select>
                    </div>
                    <div>
                        <label for="servidorImpressao">Servidor de impressão</label>
                        <input id="servidorImpressao" type="url" placeholder="https://IP:9100/print">
                    </div>
                    <div>
                        <label for="ipImpressora">IP da impressora</label>
                        <input id="ipImpressora" type="text" placeholder="192.168.1.100">
                    </div>
                    <div>
                        <label for="portaImpressora">Porta TCP</label>
                        <input id="portaImpressora" type="number" min="1" max="65535" value="9100">
                    </div>
                    <div>
                        <label for="mensagemComanda">Mensagem da Comanda</label>
                        <input id="mensagemComanda" type="text" placeholder="Obrigado pela preferência">
                    </div>
                    <div>
                        <label for="temaQuiosque">Tema do Quiosque</label>
                        <select id="temaQuiosque">
                            <option value="azul">Azul</option>
                            <option value="verde">Verde</option>
                            <option value="roxo">Roxo</option>
                            <option value="laranja">Laranja</option>
                            <option value="turquesa">Turquesa</option>
                            <option value="rosa">Rosa</option>
                            <option value="grafite">Grafite</option>
                            <option value="preto">Preto</option>
                            <option value="vermelho">Vermelho</option>
                            <option value="amarelo">Amarelo</option>
                            <option value="ciano">Ciano</option>
                            <option value="esmeralda">Esmeralda</option>
                            <option value="oceano">Oceano</option>
                            <option value="vinho">Vinho</option>
                            <option value="marrom">Marrom</option>
                            <option value="cinza">Cinza</option>
                            <option value="dourado">Dourado</option>
                            <option value="prata">Prata</option>
                            <option value="indigo">Índigo</option>
                            <option value="lima">Lima</option>
                            <option value="cobre">Cobre</option>
                        </select>
                    </div>
                    <div>
                        <label for="iniciarPesagem">Conexão da Balança</label>
                        <button id="iniciarPesagem" class="btn-login" type="button">Conectar balança</button>
                    </div>
                    <div>
                        <label>Teste de impressão</label>
                        <button id="btnTestarImpressora" class="btn-login" type="button"><i class="bi bi-printer"></i> Imprimir teste</button>
                    </div>
                </div>

                <button id="btnSalvarConfiguracao" class="btn-login"><i class="bi bi-save"></i> Salvar Configurações</button>
            </section>
        </main>
    </div>
    <script type="module" src="js/configuracoes.js"></script>
    <script type="module">import { protegerPagina } from "./js/sessao.js"; protegerPagina("configuracoes");</script>
<script src="js/sidebar-menu.js"></script>
</body>
</html>
