<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NeoScale | Relatórios</title>
<link rel="icon" href="img/favicon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/sidebar.css"><link rel="stylesheet" href="css/tema-verde.css"><link rel="stylesheet" href="css/relatorios.css">
</head>
<body>
<div class="layout"><aside class="sidebar" data-sidebar></aside>
<main class="content relatorios-page">
<div class="relatorios-shell">
<header class="rel-header"><div><p class="rel-kicker">NeoScale · Gestão</p><h1>Relatórios</h1><p>Visão gerencial das vendas, faturamento, comandas e saída de produtos.</p></div><div class="rel-actions"><button class="rel-btn" id="relImprimir"><i class="bi bi-printer"></i> Imprimir</button><button class="rel-btn primary" id="relExportar"><i class="bi bi-download"></i> Exportar CSV</button></div></header>
<section class="rel-filter">
<div class="rel-field rel-report-select"><label>Relatório</label><select id="relTipo"><option value="comandas">Comandas</option><option value="vendas-loja">Vendas da loja</option><option value="vendas-delivery">Vendas delivery</option><option value="faturamento">Faturamento</option><option value="saida-produtos">Saída de produtos</option></select></div>
<div class="rel-field"><label>Data inicial</label><input type="date" id="relInicio"></div><div class="rel-field"><label>Data final</label><input type="date" id="relFim"></div>
<div class="rel-field" id="statusField"><label>Status</label><select id="relStatus"><option value="TODOS">Todos</option><option value="ABERTA">Abertas</option><option value="FINALIZADA">Finalizadas</option><option value="CANCELADA">Canceladas</option><option value="TRANSFERIDA">Transferidas</option></select></div>
<div class="rel-field" id="tipoField"><label>Tipo</label><select id="relComandaTipo"><option value="TODOS">Todos</option><option value="PESAGEM">Pesagem</option><option value="PROVISORIA">Provisória</option><option value="DIRETA">Direta</option></select></div>
<div class="rel-field rel-search"><label>Buscar</label><input id="relBusca" type="search" placeholder="Produto, operador, plataforma..."></div>
<button class="rel-btn primary" id="relAplicar"><i class="bi bi-funnel"></i> Aplicar</button><button class="rel-btn" id="relHoje">Hoje</button>
</section>
<section class="rel-kpis" id="relKpis"></section>
<section class="rel-card full" id="relMainCard"><div class="rel-card-head"><div><h2 id="relTitulo">Relatório de Comandas</h2><p id="periodoLabel">Período selecionado</p></div><span class="rel-status" id="relStatusLabel">Todos</span></div><div id="relConteudo"></div><div class="rel-footer-note" id="relRodape">—</div></section>
</div></main></div>
<script src="js/sidebar-menu.js"></script><script type="module">import { protegerPagina } from './js/sessao.js'; protegerPagina('relatorios');</script><script type="module" src="js/relatorios.js"></script>
</body></html>
