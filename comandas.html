<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>NeoScale | Comandas</title><link rel="icon" href="img/favicon.png"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/sidebar.css"><link rel="stylesheet" href="css/tema-verde.css"><link rel="stylesheet" href="css/modulo-operacional.css"><style>
.editor-resumo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.editor-resumo>div{background:#f4f9f6;border:1px solid #e2eee9;border-radius:10px;padding:11px}.editor-resumo span,.editor-section-title span{display:block;font-size:11px;color:#71807a}.editor-section{margin-top:16px}.editor-section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.editor-search{width:100%;box-sizing:border-box;border:1px solid #d9e2df;border-radius:9px;padding:10px 12px;outline:none}.editor-search:focus{border-color:#08a579;box-shadow:0 0 0 3px rgba(8,165,121,.08)}.editor-products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:9px;max-height:230px;overflow:auto}.editor-product{border:1px solid #dce8e3;background:#fff;border-radius:9px;padding:10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:5px}.editor-product:hover{border-color:#08a579;background:#f3fff9}.editor-product span{font-size:12px;color:#087a57;font-weight:700}.editor-itens,.editor-pendentes{display:flex;flex-direction:column;gap:7px}.editor-line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 11px;background:#f7faf8;border-radius:8px;font-size:13px}.editor-line.pending{background:#effbf5}.remove-editor{margin-left:8px;border:0;background:#fff;color:#b84b4b;border-radius:6px;padding:4px 7px;cursor:pointer}@media(max-width:700px){.editor-products{grid-template-columns:repeat(2,minmax(0,1fr))}.editor-resumo{grid-template-columns:1fr}}
</style></head><body><div class="layout"><aside class="sidebar" data-sidebar></aside><main class="content operacional-page"><div class="page-head"><div><h1>Comandas</h1><p>Consulta, acompanhamento e fechamento das comandas.</p></div><div class="head-actions"><button class="btn-secondary" id="btnAtualizar"><i class="bi bi-arrow-clockwise"></i> Atualizar</button></div></div><section class="stats-grid"><div class="stat-card"><span>Em aberto</span><strong id="statAbertas">0</strong></div><div class="stat-card"><span>Finalizadas</span><strong id="statFinalizadas">0</strong></div><div class="stat-card"><span>Canceladas</span><strong id="statCanceladas">0</strong></div><div class="stat-card"><span>Valor em aberto</span><strong id="statValor">R$ 0,00</strong></div></section><section class="panel"><div class="toolbar"><div class="search-box"><i class="bi bi-search"></i><input id="buscaComanda" placeholder="Buscar por número, código ou produto..."></div><select id="filtroStatus"><option value="TODAS">Todas</option><option value="ABERTA">Abertas</option><option value="FINALIZADA">Finalizadas</option><option value="CANCELADA">Canceladas</option></select></div><div id="listaComandas" class="comandas-grid"><div class="empty grid-empty">Carregando...</div></div></section></main></div><div class="modal" id="modalComanda" hidden><div class="modal-card"><div class="modal-head"><h2 id="modalTitulo">Comanda</h2><button class="icon-btn" id="fecharModal"><i class="bi bi-x-lg"></i></button></div><div id="detalheComanda"></div><div class="modal-actions" id="acoesComanda"></div></div></div><script src="js/sidebar-menu.js"></script><script type="module" src="js/comandas-page.js"></script><script type="module">import { protegerPagina } from './js/sessao.js'; protegerPagina('comandas');</script></body></html>
