<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>NeoScale | Comandas</title><link rel="icon" href="img/favicon.png"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/sidebar.css"><link rel="stylesheet" href="css/tema-verde.css"><link rel="stylesheet" href="css/modulo-operacional.css"></head><body><div class="layout"><aside class="sidebar" data-sidebar></aside><main class="content operacional-page"><div class="page-head"><div><h1>Comandas</h1><p>Consulta, acompanhamento e fechamento das comandas.</p></div><div class="head-actions"><button class="btn-danger-outline" id="btnApagarCanceladas"><i class="bi bi-trash3"></i> Apagar canceladas</button><button class="btn-secondary" id="btnAtualizar"><i class="bi bi-arrow-clockwise"></i> Atualizar</button></div></div><section class="stats-grid"><div class="stat-card"><span>Em aberto</span><strong id="statAbertas">0</strong></div><div class="stat-card"><span>Finalizadas</span><strong id="statFinalizadas">0</strong></div><div class="stat-card"><span>Canceladas</span><strong id="statCanceladas">0</strong></div><div class="stat-card"><span>Valor em aberto</span><strong id="statValor">R$ 0,00</strong></div></section><section class="panel"><div class="toolbar"><div class="search-box"><i class="bi bi-search"></i><input id="buscaComanda" placeholder="Buscar por número, código ou produto..."></div><select id="filtroStatus"><option value="TODAS">Todas</option><option value="ABERTA">Abertas</option><option value="FINALIZADA">Finalizadas</option><option value="CANCELADA">Canceladas</option></select></div><div class="table-wrap"><table><thead><tr><th>Comanda</th><th>Produto</th><th>Peso</th><th>Total</th><th>Status</th><th>Data</th><th>Ações</th></tr></thead><tbody id="listaComandas"><tr><td colspan="7" class="empty"
