<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NeoScale | Histórico</title>


<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="css/tabela.css">

<link rel="stylesheet" href="css/sidebar.css">

<link rel="icon" type="image/png" href="img/favicon.png">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/tema-verde.css">
<link rel="stylesheet" href="css/historico-melhorado.css">
</head>


<body>


<div class="layout">


<aside class="sidebar" data-sidebar></aside>






<main class="content">


<header class="page-header">


<h2>
Histórico de Comandas
</h2>


<p>
Registro das refeições pesadas
</p>


</header>





<section class="table-card historico-filtros-card">

<div class="historico-filtros">
  <div class="historico-filtro">
    <label for="dataInicio">Data inicial</label>
    <input type="date" id="dataInicio">
  </div>
  <div class="historico-filtro">
    <label for="dataFim">Data final</label>
    <input type="date" id="dataFim">
  </div>
  <button type="button" class="btn-filtro ativo" data-periodo="hoje">Hoje</button>
  <button type="button" class="btn-filtro" data-periodo="7">7 dias</button>
  <button type="button" class="btn-filtro" data-periodo="30">30 dias</button>
  <button type="button" class="btn-filtro" data-periodo="todos">Todos</button>
  <button type="button" class="btn-limpar" id="limparFiltro">Limpar</button>
</div>

<div class="historico-resumo" id="historicoResumo">0 registros encontrados</div>

<div class="table-scroll">
<table>


<thead>

<tr>

<th>
Data
</th>


<th>
Peso
</th>


<th>
Valor
</th>


<th>
Frase
</th>


</tr>

</thead>



<tbody id="tabelaHistorico">


</tbody>



</table>
</div>

</section>




</main>



</div>




<script type="module" src="js/historico.js"></script>
<script type="module">import { protegerPagina } from "./js/sessao.js"; protegerPagina("historico");</script>


<script src="js/sidebar-menu.js"></script>
</body>

</html>
