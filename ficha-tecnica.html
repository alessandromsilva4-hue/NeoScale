<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>NeoScale | Ficha Técnica</title><link rel="icon" href="img/favicon.png"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/sidebar.css"><link rel="stylesheet" href="css/tema-verde.css"><link rel="stylesheet" href="css/modulo-operacional.css"></head><body><div class="layout"><aside class="sidebar" data-sidebar></aside><main class="content operacional-page"><div class="page-head"><div><h1>Ficha Técnica</h1><p>Controle de receitas, insumos, rendimento e custo.</p></div><button class="btn-primary" id="novaFicha"><i class="bi bi-plus-lg"></i> Nova ficha</button></div><section class="panel"><div class="toolbar"><div class="search-box"><i class="bi bi-search"></i><input id="buscaFicha" placeholder="Buscar produto ou ficha..."></div></div><div class="table-wrap"><table><thead><tr><th>Produto</th><th>Rendimento</th><th>Insumos</th><th>Custo total</th><th>Custo por unidade</th><th>Ações</th></tr></thead><tbody id="listaFichas"><tr><td colspan="6" class="empty">Carregando...</td></tr></tbody></table></div></section></main></div><div class="modal" id="modalFicha" hidden><div class="modal-card large"><div class="modal-head"><h2 id="tituloFicha">Nova ficha técnica</h2><button class="icon-btn" id="fecharFicha"><i class="bi bi-x-lg"></i></button></div><form id="formFicha"><div class="form-grid"><label>Produto<input id="produtoFicha" required placeholder="Ex.: Molho da casa"></label><label>Rendimento<input id="rendimentoFicha" type="number" min="0.001" step="0.001" value="1" required></label><label>Unidade do rendimento<select id="unidadeFicha"><option>unidade</option><option>kg</option><option>litro</option><option>porção</option></select></label></div><div class="section-title"><span>Insumos</span><button type="button" class="btn-secondary small" id="addInsumo"><i class="bi bi-plus"></i> Adicionar</button></div><div id="insumos"></div><div class="cost-summary"><span>Custo total <strong id="custoTotal">R$ 0,00</strong></span><span>Custo por rendimento <strong id="custoUnit">R$ 0,00</strong></span></div><div class="modal-actions"><button type="button" class="btn-secondary" id="cancelarFicha">Cancelar</button><button class="btn-primary">Salvar ficha</button></div></form></div></div><script src="js/sidebar-menu.js"></script><script type="module" src="js/ficha-tecnica.js"></script><script type="module">import { protegerPagina } from './js/sessao.js'; protegerPagina('ficha-tecnica');</script></body></html>
