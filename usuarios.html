<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeoScale | Usuários</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/sidebar.css"><link rel="stylesheet" href="css/tabela.css"><link rel="stylesheet" href="css/tema-verde.css">
<link rel="icon" type="image/png" href="img/favicon.png">
<style>
.users-grid{display:grid;grid-template-columns:minmax(320px,390px) 1fr;gap:20px}.form-card,.list-card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:22px;box-shadow:0 8px 24px rgba(15,23,42,.05)}
.form-card h3,.list-card h3{margin:0 0 6px}.muted{color:#64748b;font-size:13px;margin:0 0 18px}.field{margin-bottom:14px}.field label{display:block;font-size:13px;font-weight:600;color:#334155;margin-bottom:7px}.field input,.field select{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #d9e0e8;border-radius:9px;background:#fff;font:inherit}.field input:focus,.field select:focus{outline:none;border-color:#00a878;box-shadow:0 0 0 3px rgba(0,168,120,.10)}.btn-main{border:0;border-radius:9px;background:#008f68;color:#fff;padding:11px 16px;font-weight:700;cursor:pointer}.btn-main:disabled{opacity:.6;cursor:wait}.msg{display:none;margin-top:14px;padding:11px 12px;border-radius:9px;font-size:13px}.msg.ok{display:block;background:#ecfdf5;color:#047857}.msg.err{display:block;background:#fef2f2;color:#b91c1c}.users-table{width:100%;border-collapse:collapse}.users-table th,.users-table td{padding:12px 10px;border-bottom:1px solid #edf0f3;text-align:left;font-size:13px}.users-table th{color:#64748b;font-weight:600}.user-name{font-weight:700;color:#0f172a}.user-email{display:block;color:#64748b;font-size:12px;margin-top:2px}.badge{display:inline-flex;align-items:center;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:700}.badge.admin{background:#ede9fe;color:#6d28d9}.badge.caixa{background:#e0f2fe;color:#0369a1}.badge.operador{background:#dcfce7;color:#15803d}.badge.off{background:#f1f5f9;color:#64748b}.actions{display:flex;gap:6px;flex-wrap:wrap}.btn-small{border:1px solid #dbe3ea;background:#fff;color:#334155;border-radius:8px;padding:7px 9px;cursor:pointer;font-size:12px}.btn-small:hover{background:#f8fafc}.btn-small.danger{color:#b91c1c}.empty{text-align:center;padding:40px 20px;color:#64748b}.page-tools{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}.search{max-width:280px;width:100%;padding:10px 12px;border:1px solid #d9e0e8;border-radius:9px}.current-user{background:#f0fdf9;border:1px solid #d1fae5;padding:10px 12px;border-radius:10px;font-size:12px;color:#065f46;margin-bottom:18px}
@media(max-width:900px){.users-grid{grid-template-columns:1fr}.search{max-width:none}.table-wrap{overflow:auto}.users-table{min-width:700px}}
</style>
</head>
<body>
<div class="layout"><aside class="sidebar" data-sidebar></aside><main class="content">
<header class="page-header"><h2>Usuários</h2><p>Cadastre e gerencie os funcionários que terão acesso ao NeoScale.</p></header>
<div class="users-grid">
<section class="form-card"><h3>Novo funcionário</h3><p class="muted">Crie o acesso sem desconectar o administrador atual.</p><div id="currentUser" class="current-user">Carregando usuário...</div>
<form id="userForm"><div class="field"><label for="nome">Nome completo</label><input id="nome" required placeholder="Ex.: João da Silva"></div><div class="field"><label for="email">E-mail</label><input id="email" type="email" required placeholder="funcionario@empresa.com"></div><div class="field"><label for="senha">Senha inicial</label><input id="senha" type="password" minlength="6" required placeholder="Mínimo de 6 caracteres"></div><div class="field"><label for="funcao">Função</label><select id="funcao"><option value="OPERADOR">Operador</option><option value="CAIXA">Caixa</option><option value="ADMINISTRADOR">Administrador</option></select></div><button class="btn-main" id="btnCriar" type="submit"><i class="bi bi-person-plus"></i> Cadastrar funcionário</button></form><div id="mensagem" class="msg"></div></section>
<section class="list-card"><div class="page-tools"><div><h3>Funcionários cadastrados</h3><p class="muted">Controle de acesso, função e status.</p></div><input id="busca" class="search" placeholder="Buscar nome ou e-mail..."></div><div class="table-wrap"><table class="users-table"><thead><tr><th>Funcionário</th><th>Função</th><th>Status</th><th>Criado em</th><th>Ações</th></tr></thead><tbody id="listaUsuarios"></tbody></table></div></section>
</div></main></div>
<script type="module" src="js/usuarios.js"></script><script type="module">import { protegerPagina } from './js/sessao.js'; protegerPagina('usuarios');</script><script src="js/sidebar-menu.js"></script>
</body></html>
