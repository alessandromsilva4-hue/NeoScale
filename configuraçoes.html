<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>NeoScale | Configurações</title>


<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
rel="stylesheet">



<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">



<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="css/sidebar.css">

<link rel="stylesheet" href="css/tabela.css">

<link rel="icon" type="image/png" href="img/favicon.png">

</head>


<body>


<div class="layout">



<aside class="sidebar">


<div class="sidebar-logo">

<h1>NeoScale</h1>

<span>Pesagem Inteligente</span>

</div>



<nav class="sidebar-menu">


<a href="dashboard.html">

<i class="bi bi-grid"></i>

<span>Dashboard</span>

</a>



<a href="quiosque.html">

<i class="bi bi-display"></i>

<span>Quiosque</span>

</a>



<a href="produtos.html">

<i class="bi bi-basket"></i>

<span>Produtos</span>

</a>



<a href="historico.html">

<i class="bi bi-clock-history"></i>

<span>Histórico</span>

</a>



<a href="configuraçoes.html" class="active">

<i class="bi bi-gear"></i>

<span>Configurações</span>

</a>


</nav>


</aside>






<main class="content">



<header class="page-header">


<h2>

Configurações

</h2>


<p>

Personalização do NeoScale

</p>


</header>






<section class="form-card">


<h3>

Dados do Restaurante

</h3>




<div class="form-grid">


<div>

<label>

Nome do Restaurante

</label>


<input

id="nomeRestaurante"

type="text"

placeholder="Ex: Restaurante Japonês"

>


</div>





<div>

<label>

Preço Padrão Kg

</label>


<input

id="precoPadrao"

type="number"

step="0.01"

placeholder="89.90"

>


</div>





<div>

<label>

Impressora

</label>


<input

id="impressora"

type="text"

placeholder="Térmica 80mm"

>


</div>



</div>






<div class="form-grid">



<div>

<label>

Balança

</label>


<input

id="modeloBalanca"

type="text"

placeholder="USB / Serial / Bluetooth"

>


</div>





<div>

<label>

Mensagem da Comanda

</label>


<input

id="mensagemComanda"

type="text"

placeholder="Obrigado pela preferência"

>


</div>



<div>

<label>

Tema do Quiosque

</label>


<select id="temaQuiosque">
    <option value="azul">Azul</option>
    <option value="verde">Verde</option>
    <option value="roxo">Roxo</option>
    <option value="laranja">Laranja</option>
    <option value="turquesa">Turquesa</option>
    <option value="rosa">Rosa</option>
    <option value="grafite">Grafite</option>
</select>


</div>



<div>

<label for="iniciarPesagem">

Conexão da Balança

</label>


<button

id="iniciarPesagem"

class="btn-login"

type="button">

Conectar balança

</button>


</div>



</div>





<button

id="btnSalvarConfiguracao"

class="btn-login">


<i class="bi bi-save"></i>

Salvar Configurações


</button>



</section>







</main>


</div>






<script type="module" src="js/configuracoes.js"></script>


</body>

</html>
