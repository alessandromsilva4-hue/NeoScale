<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoScale | Pesagem</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/quiosque.css">
</head>
<body class="quiosque pesagem-quiosque">
    <main class="quiosque-tela" aria-label="Terminal de pesagem">
        <header class="quiosque-cabecalho">
            <div>
                <span>Bem-vindo(a), esse é o nosso</span>
                <strong>Autoatendimento</strong>
            </div>
            <div class="quiosque-acoes">
                <div class="seletor-tema">
                    <label for="temaQuiosque">Tema</label>
                    <select id="temaQuiosque" aria-label="Escolher tema de cores">
                        <option value="azul">Azul</option>
                        <option value="verde">Verde</option>
                        <option value="roxo">Roxo</option>
                        <option value="laranja">Laranja</option>
                        <option value="turquesa">Turquesa</option>
                        <option value="rosa">Rosa</option>
                        <option value="grafite">Grafite</option>
                        <option value="preto">Preto</option>
                        <option value="vermelho">Vermelho</option>
                        <option value="amarelo">Amarelo</option>
                        <option value="ciano">Ciano</option>
                        <option value="esmeralda">Esmeralda</option>
                        <option value="oceano">Oceano</option>
                        <option value="vinho">Vinho</option>
                        <option value="marrom">Marrom</option>
                        <option value="cinza">Cinza</option>
                        <option value="dourado">Dourado</option>
                        <option value="prata">Prata</option>
                        <option value="indigo">Índigo</option>
                        <option value="lima">Lima</option>
                        <option value="cobre">Cobre</option>
                    </select>
                </div>
                <div class="botoes-pesagem">
                    <a class="abrir-quiosque" href="quiosque.html">Abrir quiosque</a>
                    <button id="iniciarPesagem" type="button">Conectar balança</button>
                    <button id="emitirComanda" type="button">Emitir comanda</button>
                    <button id="emitirComandaTeste" type="button">Comanda teste</button>
                </div>
            </div>
        </header>

        <section class="quiosque-corpo">
            <div class="quiosque-mensagem">
                <h1>Coloque o prato sobre a balança</h1>
            </div>
        </section>

        <section class="quiosque-medidas" aria-label="Dados da pesagem">
            <div>
                <span>Valor KG - Refeição</span>
                <strong id="precoKgDisplay">R$ 89,90</strong>
            </div>
            <div>
                <span>Peso</span>
                <strong id="pesoDisplay">0,000 kg</strong>
            </div>
            <div>
                <span>Total</span>
                <strong id="valorDisplay">R$ 0,00</strong>
            </div>
        </section>
        <div class="quiosque-rodape">NEOSCALE <span>•</span> Experiência de pesagem inteligente</div>
    </main>

    <div id="previewComanda" class="controle-oculto"></div>
    <script src="js/quiosque.js"></script>
    <script type="module" src="js/firebase.js"></script>
    <script type="module" src="js/frases.js"></script>
    <script type="module" src="js/voz.js"></script>
    <script type="module" src="js/pesagem.js"></script>
    <script type="module" src="js/impressao.js"></script>
</body>
</html>
